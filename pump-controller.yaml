# Pump Controller - sprinkler node - ESP32-C6-DevKitC in a Canaduino ESP32
# PLC-100 V1 (a SECOND board, separate from pump-monitor which runs the
# recycle valves + ICE). This board runs standard 24 VAC solenoid zones via
# the ESPHome native sprinkler component.
#
# Two controllers on the one board (docs/sprinkler-component-notes.md):
#   Pump Lawn controller  - the 2 pump-house lawn zones, REL1/REL2.
#     valve_open_delay > 0: current zone turns OFF, gap, next turns ON.
#     (These are the dead-head stress-test zones per the roadmap - open,
#      close, open, close, off - so a clean gap between them is what we want.)
#   Field-A controller - 4 zones, REL3-REL6. NOT WIRED YET (lots of digging
#     to do). valve_overlap > 0: next line opens BEFORE the current closes,
#     so a line is never completely off (no dead-head at transitions).
#
# Solenoids are standard 24 VAC (plain GPIO relays, no H-bridge). No display.
#
# Relays: PCA9557 I2C expander @ 0x1A -> ULN2003 (IO1..IO6). Same board/
# pinout as pump-monitor.
#
# Upload:  ./upload.sh <this-board-ip> pump-controller.yaml
# (upload.sh injects secrets from secrets.h; pass the board's own IP since
#  DEVICE_IP in secrets.h defaults to the pump-monitor board.)

substitutions:
  # Zone-transition timing. An auto-advance transition costs one gap
  # (lawn_open_delay), so a full lawn cycle is 15 + 5 + 15 = 35 s. Pressing Next
  # costs a DOUBLE gap -- the component's interrupt path sets the timer to
  # "switching_delay_.value() * 2" (sprinkler.cpp) -- so the Next re-plan below
  # adds 2 x lawn_open_delay, measured at 10 s in the frame captures.
  lawn_open_delay: "5"
  field_a_overlap: "15"
  wifi_ssid: "PLACEHOLDER"
  wifi_password: "PLACEHOLDER"
  ap_password: "PLACEHOLDER"
  ota_password: "PLACEHOLDER"
  api_key: "PLACEHOLDER"

esphome:
  name: pump-controller
  friendly_name: Pump Controller
  on_boot:
    # Battery test for the DS3231: read the CHIP (RealTimeClock::now() only
    # reports system time - ds1307.read_time is what actually talks to 0x68)
    # and latch it before SNTP has a chance to correct anything. A dead coin
    # cell still ACKs on i2c, so presence in the bus scan proves nothing; this
    # boot value after a power cut is the real evidence.
    priority: -100
    then:
      - ds1307.read_time: rtc_time
      - lambda: |-
          // Report the RAW chip contents, valid or not: ESPTime::is_valid()
          // rejects year < 2019, so a never-written RTC (2000-01-01) would
          // otherwise just read "INVALID" and hide which failure it is.
          // 2000-01-01 = never set / lost power. A real date = battery held.
          auto t = id(rtc_time).now();
          char buf[72];
          snprintf(buf, sizeof(buf), "%04d-%02d-%02d %02d:%02d:%02d%s",
                   t.year, t.month, t.day_of_month, t.hour, t.minute, t.second,
                   t.is_valid() ? "" : "  <- unset/invalid");
          id(rtc_boot_time) = std::string(buf);

esp32:
  board: esp32-c6-devkitc-1
  variant: esp32c6
  framework:
    type: esp-idf

wifi:
  ssid: ${wifi_ssid}
  password: ${wifi_password}
  power_save_mode: NONE
  reboot_timeout: 15min
  ap:
    ssid: "Pump-Controller"
    password: ${ap_password}

captive_portal:

api:
  encryption:
    key: ${api_key}

ota:
  platform: esphome
  password: ${ota_password}

logger:
  level: INFO

i2c:   # REQUIRED - this is the bus the PCA9557 relay expander lives
  sda: 6   # on (every zone relay is driven through it). NOT a temp-sensor
  scl: 7   # bus - do not remove.
  scan: true

pca9554:   # PCA9557 - same register map; relays on IO1..IO6 (IO0 skipped)
  - id: relay_expander
    address: 0x1A

# Raw relay outputs -> 24 VAC solenoids. Internal: the sprinkler component
# drives these via valve_switch_id; HA sees the sprinkler "zone" switches,
# not these raw relays.
switch:
  - platform: gpio
    id: rel_lawn1
    internal: true
    restore_mode: ALWAYS_OFF
    pin: {pca9554: relay_expander, number: 1, mode: OUTPUT}
  - platform: gpio
    id: rel_lawn2
    internal: true
    restore_mode: ALWAYS_OFF
    pin: {pca9554: relay_expander, number: 2, mode: OUTPUT}
  - platform: gpio
    id: rel_fielda1
    internal: true
    restore_mode: ALWAYS_OFF
    pin: {pca9554: relay_expander, number: 3, mode: OUTPUT}
  - platform: gpio
    id: rel_fielda2
    internal: true
    restore_mode: ALWAYS_OFF
    pin: {pca9554: relay_expander, number: 4, mode: OUTPUT}
  - platform: gpio
    id: rel_fielda3
    internal: true
    restore_mode: ALWAYS_OFF
    pin: {pca9554: relay_expander, number: 5, mode: OUTPUT}
  - platform: gpio
    id: rel_fielda4
    internal: true
    restore_mode: ALWAYS_OFF
    pin: {pca9554: relay_expander, number: 6, mode: OUTPUT}

time:
  - platform: ds1307          # the DS3231 at 0x68 - register-compatible
    id: rtc_time
    timezone: America/Los_Angeles
    update_interval: never    # only read on demand, never clobber system time
  - platform: sntp
    id: net_time
    timezone: America/Los_Angeles
    on_time_sync:
      then:
        - ds1307.write_time:            # push good network time into the chip
            id: rtc_time

globals:
  - id: rtc_boot_time
    type: std::string
    initial_value: '"(not read)"'
  - id: lawn_prev_running
    type: bool
    initial_value: "false"
  - id: lawn_cycle_start
    type: uint32_t
    initial_value: "0"
  - id: lawn_total_elapsed
    type: uint32_t
    initial_value: "0"
  - id: lawn_zone_elapsed
    type: uint32_t
    initial_value: "0"
  - id: lawn_total_remaining
    type: uint32_t
    initial_value: "0"
  - id: lawn_planned_total
    type: uint32_t
    initial_value: "0"
  - id: field_a_prev_running
    type: bool
    initial_value: "false"
  - id: field_a_cycle_start
    type: uint32_t
    initial_value: "0"
  - id: field_a_total_elapsed
    type: uint32_t
    initial_value: "0"
  - id: field_a_zone_elapsed
    type: uint32_t
    initial_value: "0"
  - id: field_a_total_remaining
    type: uint32_t
    initial_value: "0"
  - id: field_a_planned_total
    type: uint32_t
    initial_value: "0"

interval:
  - interval: 500ms
    then:
      - lambda: |-
          {
            bool running = id(lawn_main).state;
            if (running && !id(lawn_prev_running)) {   // rising edge = new cycle
              id(lawn_cycle_start) = millis();
              id(lawn_total_elapsed) = 0;
              id(lawn_zone_elapsed) = 0;
              uint32_t n = id(lawn_controller).number_of_valves();
              uint32_t sum = 0;
              for (uint32_t i = 0; i < n; i++)
                sum += id(lawn_controller).valve_run_duration_adjusted(i);
              id(lawn_planned_total) = n > 1 ? sum + ${lawn_open_delay} * (n - 1) : sum;
            }
            if (!running && id(lawn_prev_running)) {   // cycle ended: freeze elapsed
              id(lawn_total_remaining) = 0;
              id(lawn_zone_elapsed) = 0;
            }
            id(lawn_prev_running) = running;
            if (running) {
              id(lawn_total_elapsed) = (millis() - id(lawn_cycle_start)) / 1000;
              // Gate on a LIVE timer, not on active_valve(): the FSM designates
              // the next valve at the START of the inter-zone gap, seconds
              // before the switch opens. Holding the last value through the
              // gap keeps zone elapsed + remaining == run duration.
              auto v = id(lawn_controller).active_valve();
              auto t = id(lawn_controller).time_remaining_active_valve();
              if (v.has_value() && t.has_value() && t.value() > 0) {
                uint32_t dur = id(lawn_controller).valve_run_duration_adjusted(v.value());
                id(lawn_zone_elapsed) = dur > t.value() ? dur - t.value() : 0;
              }
              uint32_t plan = id(lawn_planned_total);
              uint32_t el = id(lawn_total_elapsed);
              id(lawn_total_remaining) = plan > el ? plan - el : 0;
            }
          }
          {
            bool running = id(field_a_main).state;
            if (running && !id(field_a_prev_running)) {   // rising edge = new cycle
              id(field_a_cycle_start) = millis();
              id(field_a_total_elapsed) = 0;
              id(field_a_zone_elapsed) = 0;
              uint32_t n = id(field_a_controller).number_of_valves();
              uint32_t sum = 0;
              for (uint32_t i = 0; i < n; i++)
                sum += id(field_a_controller).valve_run_duration_adjusted(i);
              id(field_a_planned_total) = n > 1 ? sum - ${field_a_overlap} * (n - 1) : sum;
            }
            if (!running && id(field_a_prev_running)) {   // cycle ended: freeze elapsed
              id(field_a_total_remaining) = 0;
              id(field_a_zone_elapsed) = 0;
            }
            id(field_a_prev_running) = running;
            if (running) {
              id(field_a_total_elapsed) = (millis() - id(field_a_cycle_start)) / 1000;
              // Gate on a LIVE timer, not on active_valve(): the FSM designates
              // the next valve at the START of the inter-zone gap, seconds
              // before the switch opens. Holding the last value through the
              // gap keeps zone elapsed + remaining == run duration.
              auto v = id(field_a_controller).active_valve();
              auto t = id(field_a_controller).time_remaining_active_valve();
              if (v.has_value() && t.has_value() && t.value() > 0) {
                uint32_t dur = id(field_a_controller).valve_run_duration_adjusted(v.value());
                id(field_a_zone_elapsed) = dur > t.value() ? dur - t.value() : 0;
              }
              uint32_t plan = id(field_a_planned_total);
              uint32_t el = id(field_a_total_elapsed);
              id(field_a_total_remaining) = plan > el ? plan - el : 0;
            }
          }

sprinkler:
  # --- Pump-house lawn: gap between zones (off, then on) ---
  - id: lawn_controller
    main_switch:
      name: "Pump Lawn"
      id: lawn_main
    auto_advance_switch:
      name: "Pump Lawn Auto Advance"
      id: lawn_auto_advance
    valve_open_delay: ${lawn_open_delay}s
    valves:
      - valve_switch: "Pump Lawn Zone 1"
        run_duration_number:
          name: "Pump Lawn Zone 1 Duration"
          initial_value: 15
          min_value: 1
          max_value: 180
          step: 1
          unit_of_measurement: s
          restore_value: true
        valve_switch_id: rel_lawn1
      - valve_switch: "Pump Lawn Zone 2"
        run_duration_number:
          name: "Pump Lawn Zone 2 Duration"
          initial_value: 15
          min_value: 1
          max_value: 180
          step: 1
          unit_of_measurement: s
          restore_value: true
        valve_switch_id: rel_lawn2

  # --- Field A: overlap so a line is never fully off (NOT wired yet) ---
  - id: field_a_controller
    main_switch:
      name: "Field A"
      id: field_a_main
    auto_advance_switch:
      name: "Field A Auto Advance"
      id: field_a_auto_advance
    valve_overlap: ${field_a_overlap}s
    valves:
      - valve_switch: "Field A Zone 1"
        run_duration_number:
          name: "Field A Zone 1 Duration"
          initial_value: 60
          min_value: 1
          max_value: 360
          step: 1
          unit_of_measurement: s
          restore_value: true
        valve_switch_id: rel_fielda1
      - valve_switch: "Field A Zone 2"
        run_duration_number:
          name: "Field A Zone 2 Duration"
          initial_value: 60
          min_value: 1
          max_value: 360
          step: 1
          unit_of_measurement: s
          restore_value: true
        valve_switch_id: rel_fielda2
      - valve_switch: "Field A Zone 3"
        run_duration_number:
          name: "Field A Zone 3 Duration"
          initial_value: 60
          min_value: 1
          max_value: 360
          step: 1
          unit_of_measurement: s
          restore_value: true
        valve_switch_id: rel_fielda3
      - valve_switch: "Field A Zone 4"
        run_duration_number:
          name: "Field A Zone 4 Duration"
          initial_value: 60
          min_value: 1
          max_value: 360
          step: 1
          unit_of_measurement: s
          restore_value: true
        valve_switch_id: rel_fielda4

sensor:
  # --- Pump Lawn timers ---------------------------------------------------
  # All four come straight from the sprinkler component's own accounting, so
  # they stay correct when Next is pressed (the skipped zone drops out of
  # "incomplete" and the totals fall immediately). Idle reads 0, not NAN, so
  # HA gauges/templates never have to guard against "unknown".
  # The totals already include the inter-zone gap: total_cycle_time_*() adds
  # switching_delay x (n-1) for valve_open_delay, and SUBTRACTS it for
  # valve_overlap.
  - platform: template
    name: "Pump Lawn Zone Remaining"
    unit_of_measurement: s
    accuracy_decimals: 0
    icon: "mdi:timer-sand"
    update_interval: 1s
    lambda: |-
      auto t = id(lawn_controller).time_remaining_active_valve();
      if (!t.has_value()) return 0.0f;
      return (float) t.value();
  - platform: template
    name: "Pump Lawn Zone Elapsed"
    unit_of_measurement: s
    accuracy_decimals: 0
    icon: "mdi:timer-outline"
    update_interval: 1s
    lambda: |-
      return (float) id(lawn_zone_elapsed);
  - platform: template
    name: "Pump Lawn Total Remaining"
    unit_of_measurement: s
    accuracy_decimals: 0
    icon: "mdi:timer-sand-complete"
    update_interval: 1s
    lambda: |-
      return (float) id(lawn_total_remaining);
  - platform: template
    name: "Pump Lawn Total Elapsed"
    unit_of_measurement: s
    accuracy_decimals: 0
    icon: "mdi:timer-check-outline"
    update_interval: 1s
    lambda: |-
      return (float) id(lawn_total_elapsed);

  # --- Field A timers ---------------------------------------------------
  # All four come straight from the sprinkler component's own accounting, so
  # they stay correct when Next is pressed (the skipped zone drops out of
  # "incomplete" and the totals fall immediately). Idle reads 0, not NAN, so
  # HA gauges/templates never have to guard against "unknown".
  # The totals already include the inter-zone gap: total_cycle_time_*() adds
  # switching_delay x (n-1) for valve_open_delay, and SUBTRACTS it for
  # valve_overlap.
  - platform: template
    name: "Field A Zone Remaining"
    unit_of_measurement: s
    accuracy_decimals: 0
    icon: "mdi:timer-sand"
    update_interval: 1s
    lambda: |-
      auto t = id(field_a_controller).time_remaining_active_valve();
      if (!t.has_value()) return 0.0f;
      return (float) t.value();
  - platform: template
    name: "Field A Zone Elapsed"
    unit_of_measurement: s
    accuracy_decimals: 0
    icon: "mdi:timer-outline"
    update_interval: 1s
    lambda: |-
      return (float) id(field_a_zone_elapsed);
  - platform: template
    name: "Field A Total Remaining"
    unit_of_measurement: s
    accuracy_decimals: 0
    icon: "mdi:timer-sand-complete"
    update_interval: 1s
    lambda: |-
      return (float) id(field_a_total_remaining);
  - platform: template
    name: "Field A Total Elapsed"
    unit_of_measurement: s
    accuracy_decimals: 0
    icon: "mdi:timer-check-outline"
    update_interval: 1s
    lambda: |-
      return (float) id(field_a_total_elapsed);

  - platform: wifi_signal
    name: "WiFi RSSI"
    update_interval: 60s
    entity_category: diagnostic
  - platform: uptime
    name: "Uptime"
    update_interval: 60s
    entity_category: diagnostic

text_sensor:
  - platform: template
    name: "RTC Time At Boot"
    icon: "mdi:clock-check-outline"
    entity_category: diagnostic
    update_interval: 60s
    lambda: 'return {id(rtc_boot_time)};'
  - platform: wifi_info
    ip_address:
      name: "IP Address"
      entity_category: diagnostic
    ssid:
      name: "WiFi Network"
      entity_category: diagnostic

button:
  # Walk the zones by hand for inspection: start the controller from HA,
  # check zone 1, press Next, check zone 2, ... Next wraps around past the
  # last zone, so end the walk by turning the main switch off (shutdown).
  #
  # Next turns auto-advance OFF first. The component does NOT mark an
  # interrupted valve complete ("Valve cycle interrupted - NOT flagging valve
  # as complete", sprinkler.cpp), so with auto-advance still on the cycle
  # sweeps the skipped zone back up at the end - press Next during zone 1 and
  # you get 2 then 1 again. Dropping auto-advance makes Next mean "skip it,
  # for good". Self-cleaning: starting a cycle from the main switch calls
  # prep_full_cycle_(), which sets auto-advance back to true.
  - platform: template
    name: "Pump Lawn Next Zone"
    icon: "mdi:skip-next"
    on_press:
      - lambda: |-
          // Re-plan: the rest of the current zone is abandoned, so the cycle now
          // ends after one gap + the next zone. Computed BEFORE next_valve() so
          // active_valve() still reports the zone being skipped.
          auto v = id(lawn_controller).active_valve();
          if (v.has_value()) {
            uint32_t n = id(lawn_controller).number_of_valves();
            uint32_t nxt = (v.value() + 1) % n;
            id(lawn_planned_total) = id(lawn_total_elapsed) + 2 * ${lawn_open_delay}
                                    + id(lawn_controller).valve_run_duration_adjusted(nxt);
          }
      - switch.turn_off: lawn_auto_advance
      - sprinkler.next_valve: lawn_controller
  - platform: template
    name: "Field A Next Zone"
    icon: "mdi:skip-next"
    on_press:
      - lambda: |-
          // Re-plan: the rest of the current zone is abandoned, so the cycle now
          // ends after one gap + the next zone. Computed BEFORE next_valve() so
          // active_valve() still reports the zone being skipped.
          auto v = id(field_a_controller).active_valve();
          if (v.has_value()) {
            uint32_t n = id(field_a_controller).number_of_valves();
            uint32_t nxt = (v.value() + 1) % n;
            id(field_a_planned_total) = id(field_a_total_elapsed) + -${field_a_overlap}
                                    + id(field_a_controller).valve_run_duration_adjusted(nxt);
          }
      - switch.turn_off: field_a_auto_advance
      - sprinkler.next_valve: field_a_controller

  - platform: restart
    name: "Restart"
    icon: "mdi:restart"
